<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        // JS -> 변수 선언 변수명 = 값;
        // 1. var (variable) = 변수 재선언 가능
        var num = 10;
        document.write("var 데이터 : ", num, "<br><br>");
        
        // 2. let = 변수 재선언 불가
        let num_ = 7;
        document.write("let 데이터 : ", num_, "<br><br>");
        
        // 3. const 상수 = 재선언 재할당 x
        const num__ = 12;
        // temp = 100;
        document.write("const 데이터 : ", num__, "<br><br>");
    </script>
</body>
</html>
