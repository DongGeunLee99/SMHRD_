<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 호이스팅 발생 - 선언된 함수가 유효범위의 최상단으로 끌어올려지는 것
        // 1. 함수 선언방법
        // 1-1) 함수 선언문 - 호이스팅 O        
        function add_num(num1, num2) {
            return num1 + num2
        }
        // 1-2) 함수 표현식 - 호이스팅 X
        subnum = function(num1, num2){
            return num1 - num2
        }
        // 1-3) 화살표 함수 - 호이스팅 X
        mul_num = (num1, num2) => {
            return num1 * num2
        }

        //  2. 함수 특징
        // 2-1) 매개변수의 자료형 검사를 하지 않는다.
        console.log(add_num(1, 2))
        // 2-2) 매개변수의 개수도 확인하지 않는다.
        console.log(add_num(1, 2, 3))
        console.log(add_num(true,true))
        // 2-3) 함수를 선언하면 자동으로 내부에 arguments 객체를 생성해서
        //        전달받은 인자를 전부 배열과 같은 형태로 저장
        //      -> 선언할 때 지정한 매개변수의 개수만큼만 사용

    </script>
</body>
</html>
