# 스프링 부트 환경설정
# 여기서 설정한 모든 프로퍼티들은 각각의 객체의 setter 메소드를 사용하는 방식으로 구성
spring.application.name=01SpringBoot

# 프로젝트 context-path 설정
# 프로젝트 이름 : 01SpringBoot
# url 경로 : /web
server.servlet.context-path=/web

# port 번호 설정
server.port=8088

# ViewResolver (화면 이름을 해석하는 클래스) 에게 jsp 파일을 사용할 수 있도록 접두사 / 접미사 지정
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# BD 연결
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=hr
spring.datasource.password=12345

# mybatis alias
mybatis.type-aliases-package=kr.bigdata.web.entity
# console에 출력되는 배너 끄는 방법
#spring.main.banner-mode=off

# devtools -> 코드를 수정을 하고, 저장을 하면 서버를 재시작하는 역할
#spring.devtools.livereload.enabled=false
#spring.devtools.restart.enabled=false