<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1. 산술연산자
        // ->  / 몫을 구할 때 소수점이 나올 수 있다.
        console.log(10/3);
        console.log(parseInt(10/3)); // 정수로 변환
        // 2. 증감연산자 (++)
        // 3. 대입연산자 (+=)
        // 4. 논리연산자 (&&)
        // 5. 삼항연산자
        // 6. 비교연산자 (===, ==, !=)
        // 6-1) == (동등 연산자)
        // : 값 비교
        console.log(7 == "7")
        // 6-2) === (일치 연산자)
        // : 값 + 자료형까지 비교
        console.log(7 === "7")

    </script>
</body>
</html>
